name: Deploy AI Notes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-jupyter

      - name: Prepare docs directory structure
        run: |
          mkdir -p docs
          for dir in 01-math-foundations 02-classical-ml 03-deep-learning-core 04-sota-paper-implementations 05-llms-from-scratch 06-applied-genai-and-agents 07-mlops-and-systems machine-learning-specialization-andrew-ng; do
            if [ -d "$dir" ]; then
              cp -r "$dir" docs/
            fi
          done
          cp README.md docs/index.md
          find docs/ -name "*.mdx" -exec bash -c 'mv "$0" "${0%.mdx}.md"' {} \;
          find docs/ -name "*.md" -exec sed -i 's/\.mdx/\.md/g' {} +

      - name: Build documentation
        run: |
          mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
